<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POC Modelos de check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Protótipo descartável (POC) para validar com o Diego os MODELOS DE CHECK-IN antes de construir no app:
  a Central ou o gestor cria um modelo (etapas e tarefas, com prazos e dependências); o modelo é aplicado
  no cliente; o consultor segue como check-list (lista ou fluxograma) e o que ele marca entra no check-in.
  Dados de exemplo, tudo em memória: "Restaurar exemplo" (ou recarregar) volta ao começo.
-->
<style>
:root {
  --moldura: #ffffff; --painel: #eef1f5; --fg: #0f172a; --card: #ffffff;
  --primary: #2563eb; --primary-fg: #ffffff; --muted: #f1f5f9; --muted-fg: #64748b;
  --accent: #eff6ff; --accent-fg: #1e3a8a; --destructive: #dc2626; --destructive-soft: #fee2e2;
  --border: #e2e8f0; --input: #cbd5e1; --ring: #2563eb;
  --notice: #b45309; --notice-soft: #fef3c7; --positive: #15803d; --positive-soft: #dcfce7;
  --overlay: rgb(15 23 42 / 0.5);
  --sombra-card: 0 1px 2px rgb(15 23 42 / 0.04), 0 1px 3px rgb(15 23 42 / 0.05);
  --sombra-janela: 0 24px 60px -12px rgb(15 23 42 / 0.35);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --moldura: #0e1424; --painel: #080c17; --fg: #e5e9f0; --card: #121a2c;
    --primary: #3b82f6; --muted: #1b2438; --muted-fg: #94a0b8; --accent: #172554; --accent-fg: #bfdbfe;
    --destructive: #f05252; --destructive-soft: rgb(240 82 82 / 0.14); --border: #222c42; --input: #34405a; --ring: #60a5fa;
    --notice: #fbbf24; --notice-soft: rgb(251 191 36 / 0.14); --positive: #4ade80; --positive-soft: rgb(74 222 128 / 0.14);
    --overlay: rgb(0 0 0 / 0.6);
    --sombra-card: 0 0 0 1px rgb(255 255 255 / 0.03);
    --sombra-janela: 0 0 0 1px rgb(255 255 255 / 0.06), 0 24px 60px -12px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 13.5px/20px 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--painel); color: var(--fg); -webkit-font-smoothing: antialiased;
}
body.com-janela { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.t-titulo { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.t-janela { font-size: 15px; line-height: 20px; font-weight: 700; margin: 0; }
.t-rotulo { font-size: 12.5px; line-height: 18px; }
.t-legenda { font-size: 11px; line-height: 16px; color: var(--muted-fg); }
.mudo { color: var(--muted-fg); }
.m0 { margin: 0; }
.min0 { min-width: 0; }
.flex1 { flex: 1; }
.bloco { display: block; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.section-label { font-size: 10.5px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-fg); }

/* Faixa do protótipo */
.faixa { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; background: var(--notice-soft); border-bottom: 1px solid var(--border); }
.selo-poc { font-weight: 700; color: var(--notice); font-size: 12.5px; }
.faixa .ver-como { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

/* Moldura (trilho + barra de cima) */
.app { display: grid; grid-template-columns: 76px minmax(0, 1fr); grid-template-rows: 52px 1fr; min-height: calc(100vh - 46px); }
.trilho { grid-row: 1 / span 2; background: var(--moldura); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; }
.logo { width: 36px; height: 36px; background: #0b1f4d; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 800; letter-spacing: .02em; margin-bottom: 10px; flex: none; }
.item-trilho { width: 66px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; color: var(--muted-fg); font-size: 10.5px; line-height: 13px; text-align: center; background: none; border: 0; cursor: pointer; }
.item-trilho .ic { width: 36px; height: 30px; display: grid; place-items: center; border-radius: 9px; transition: background-color .15s; }
.item-trilho:hover .ic { background: var(--muted); }
.item-trilho.aberto { color: var(--fg); font-weight: 600; }
.item-trilho.aberto .ic { background: var(--primary); color: var(--primary-fg); }
.item-trilho .ic svg { width: 18px; height: 18px; }
@keyframes icone-subir { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-4px); } 70% { transform: translateY(1px); } }
@keyframes icone-transmitir { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.22); } 40% { transform: scale(1); } 60% { transform: scale(1.22); } 80% { transform: scale(1); } }
@keyframes icone-abrir { 0%, 100% { transform: none; } 45% { transform: perspective(60px) rotateX(-28deg) translateY(-1px); } }
@keyframes icone-erguer { 0%, 100% { transform: scaleY(1); } 40% { transform: translateY(-2px) scaleY(1.18); } 70% { transform: scaleY(0.95); } }
.anim-erguer { transform-origin: bottom center; }
.group:hover .anim-subir, .group:focus-visible .anim-subir { animation: icone-subir .55s ease-out; }
.group:hover .anim-transmitir, .group:focus-visible .anim-transmitir { animation: icone-transmitir .7s ease-in-out; }
.group:hover .anim-abrir, .group:focus-visible .anim-abrir { animation: icone-abrir .55s ease-in-out; }
.group:hover .anim-erguer, .group:focus-visible .anim-erguer { animation: icone-erguer .55s ease-out; }
.barra-topo { background: var(--moldura); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 20px; min-width: 0; }
.barra-topo .caminho { color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.barra-topo .caminho b { color: var(--fg); font-weight: 600; }
.barra-topo .quem { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
main { padding: 24px 28px 48px; min-width: 0; }

/* Peças comuns */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--sombra-card); }
.cabecalho { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.cabecalho-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sub-cabecalho { margin: 2px 0 0; color: var(--muted-fg); max-width: 760px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 12px;
  border: 1px solid transparent; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
  background: var(--primary); color: var(--primary-fg);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 4px 12px -4px rgb(37 99 235 / .55);
  transition: transform .15s, box-shadow .15s, background-color .15s, border-color .15s, color .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 8px 18px -6px rgb(37 99 235 / .55); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.contorno { background: var(--card); color: color-mix(in srgb, var(--fg) 82%, transparent); border-color: var(--border); box-shadow: 0 1px 2px rgb(15 23 42 / .05); }
.btn.contorno:hover { border-color: color-mix(in srgb, var(--primary) 35%, transparent); background: var(--accent); color: var(--accent-fg); }
.btn.fantasma { background: none; box-shadow: none; color: var(--muted-fg); font-weight: 500; }
.btn.fantasma:hover { background: var(--accent); color: var(--accent-fg); }
.btn.pequeno { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 10px; }
.btn.perigo { background: var(--destructive); box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 4px 12px -4px rgb(220 38 38 / .55); }
.btn.contorno.realce-perigo:hover, .btn.fantasma.realce-perigo:hover { border-color: color-mix(in srgb, var(--destructive) 40%, transparent); background: var(--destructive-soft); color: var(--destructive); }
.btn:hover svg.i { animation: pulinho .45s ease-out; }
.btn:hover svg.mais-gira { animation: none; transform: rotate(90deg); }
.btn svg.mais-gira { transition: transform .2s; }
@keyframes pulinho { 40% { transform: translateY(-2px) scale(1.08); } }
.btn-icone { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; border: 0; background: none; color: var(--muted-fg); cursor: pointer; transition: transform .15s, background-color .15s, color .15s; flex: none; padding: 0; }
.btn-icone:hover { background: var(--accent); color: var(--accent-fg); transform: translateY(-1px); }
.btn-icone:active { transform: scale(.97); }
.btn-icone.perigo:hover { background: var(--destructive-soft); color: var(--destructive); }
.btn-icone:disabled { opacity: .3; cursor: default; transform: none; background: none; color: var(--muted-fg); }
.btn-icone svg.i { width: 15px; height: 15px; }

.segmentado { display: inline-flex; max-width: 100%; overflow-x: auto; gap: 2px; padding: 4px; border-radius: 12px; background: var(--muted); font-size: 12.5px; font-weight: 600; scrollbar-width: none; }
.segmentado button { border: 0; background: none; color: var(--muted-fg); padding: 5px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: transform .15s, color .15s, background-color .15s; }
.segmentado button:hover { color: var(--fg); transform: translateY(-1px); }
.segmentado button:active { transform: scale(.97); }
.segmentado button[aria-pressed="true"], .segmentado button[aria-selected="true"] { background: var(--card); color: var(--primary); box-shadow: 0 1px 3px rgb(15 23 42 / .12); }
.segmentado svg.i { width: 13px; height: 13px; }
.segmentado .n { font-size: 10px; font-weight: 700; line-height: 14px; padding: 1px 6px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); }
.segmentado .n.aviso { background: var(--notice-soft); color: var(--notice); }

.barra-filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px; margin-bottom: 16px; }
.fim { margin-left: auto; }
.busca { position: relative; flex: 1 1 200px; max-width: 320px; min-width: 0; }
.busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-fg); pointer-events: none; }
.busca .input { padding-left: 36px; }
.input {
  width: 100%; height: 38px; padding: 0 12px; font: inherit; font-size: 13.5px; color: var(--fg); background: var(--card);
  border: 1px solid var(--border); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:hover { border-color: var(--input); }
.input:focus { border-color: color-mix(in srgb, var(--primary) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
textarea.input { height: auto; min-height: 76px; padding: 8px 12px; resize: vertical; line-height: 20px; }
.input[aria-invalid="true"] { border-color: var(--destructive); }
.input.fino { height: 32px; font-size: 12.5px; }
.form-label { display: block; font-size: 12.5px; line-height: 18px; font-weight: 500; color: color-mix(in srgb, var(--fg) 80%, transparent); margin-bottom: 6px; }
.ajuda { font-size: 11.5px; line-height: 16px; color: var(--muted-fg); margin: 6px 0 0; }
.erro { color: var(--destructive); font-size: 12.5px; line-height: 18px; margin: 0; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 16px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid transparent; white-space: nowrap; }
.badge svg.i { width: 12px; height: 12px; }
.badge.positivo { background: var(--positive-soft); color: var(--positive); }
.badge.aviso { background: var(--notice-soft); color: var(--notice); }
.badge.perigo { background: var(--destructive-soft); color: var(--destructive); }
.badge.azul { background: var(--accent); color: var(--accent-fg); }
.badge.cinza { background: var(--muted); color: var(--muted-fg); }
.badge.contorno { border-color: var(--border); color: var(--muted-fg); }

.tabela-card { overflow: hidden; }
.rolagem { overflow-x: auto; position: relative; }
table { width: 100%; border-collapse: collapse; text-align: left; }
thead { background: color-mix(in srgb, var(--muted) 55%, transparent); color: var(--muted-fg); font-size: 12.5px; }
th { font-weight: 500; padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: color-mix(in srgb, var(--muted) 45%, transparent); }
td.acoes { text-align: right; white-space: nowrap; }
.nome { font-weight: 600; }
.sub { color: var(--muted-fg); font-size: 12px; line-height: 17px; }
.link-nome { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; text-align: left; color: var(--fg); }
.link-nome:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
.vazio { border: 1px dashed var(--input); border-radius: 16px; padding: 32px; text-align: center; color: var(--muted-fg); background: color-mix(in srgb, var(--card) 60%, transparent); }
.pessoa { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 700; flex: none; }
.barra { height: 6px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.barra > span { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s; }
.barra.grande { height: 8px; }
.barra.verde > span { background: var(--positive); }

/* Check-in do cliente */
.grade-topo { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.cartao { padding: 16px; display: grid; gap: 14px; align-content: start; }
.cartao-topo { display: flex; align-items: flex-start; gap: 12px; }
.pct { margin-left: auto; font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.numero-card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--card); min-width: 0; }
.numero-card .valor { font-size: 20px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.numero-card.perigo .valor { color: var(--destructive); }
.numero-card.aviso .valor { color: var(--notice); }
.numero-card.positivo .valor { color: var(--positive); }
.janela-icone { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary); flex: none; }
.janela-icone svg.i { width: 20px; height: 20px; }
.sessao-tempo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cronometro { font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sessao-lista { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sessao-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.ponto-vivo { width: 7px; height: 7px; border-radius: 99px; background: var(--positive); animation: vivo 1.6s infinite; }
@keyframes vivo { 0% { box-shadow: 0 0 0 0 rgb(21 128 61 / .5); } 70% { box-shadow: 0 0 0 7px rgb(21 128 61 / 0); } 100% { box-shadow: 0 0 0 0 rgb(21 128 61 / 0); } }
.faixa-info { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); margin-bottom: 16px; font-size: 12.5px; line-height: 18px; }
.faixa-info svg.i { margin-top: 2px; }
.lista-etapas { display: grid; gap: 14px; }
.etapa { overflow: hidden; }
.etapa-topo { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 40%, transparent); }
.etapa-topo h3 { margin: 0; font-size: 13.5px; font-weight: 700; }
.progresso-mini { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.progresso-mini .barra { width: 80px; }
.numero { width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 700; flex: none; }
.tarefas { list-style: none; margin: 0; padding: 0; }
.tarefa { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: start; transition: background-color .15s; }
.tarefa:last-child { border-bottom: 0; }
.tarefa:hover { background: color-mix(in srgb, var(--muted) 35%, transparent); }
.tarefa.atrasada { box-shadow: inset 3px 0 0 var(--destructive); }
.tarefa.hoje { box-shadow: inset 3px 0 0 var(--notice); }
.tarefa.andamento { box-shadow: inset 3px 0 0 var(--primary); }
.caixa { width: 20px; height: 20px; margin-top: 1px; border-radius: 6px; border: 1.5px solid var(--input); background: var(--card); display: grid; place-items: center; cursor: pointer; color: #fff; padding: 0; transition: transform .15s, background-color .15s, border-color .15s; }
.caixa:hover { border-color: var(--primary); transform: translateY(-1px); }
.caixa:active { transform: scale(.9); }
.caixa[aria-checked="true"] { background: var(--positive); border-color: var(--positive); }
.caixa[aria-disabled="true"] { cursor: not-allowed; }
.caixa[aria-disabled="true"]:not([aria-checked="true"]) { background: var(--muted); }
.caixa.trancada { color: var(--muted-fg); }
.caixa svg.i { width: 12px; height: 12px; stroke-width: 3; }
.caixa.trancada svg.i { stroke-width: 2.25; }
.tarefa-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tarefa-nome { font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--fg); }
.tarefa-nome:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
.tarefa.feito .tarefa-nome { color: var(--muted-fg); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted-fg) 60%, transparent); }
.tarefa-desc { color: var(--muted-fg); font-size: 12.5px; line-height: 18px; margin-top: 1px; }
.tarefa-meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; align-items: center; }
.nota { display: flex; gap: 8px; align-items: flex-start; background: var(--muted); border-radius: 10px; padding: 6px 10px; margin-top: 8px; font-size: 12.5px; line-height: 18px; }
.nota svg.i { margin-top: 2px; color: var(--muted-fg); width: 13px; height: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; padding: 2px 4px 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font-size: 11.5px; line-height: 16px; font-weight: 600; }
.chip.so-texto { padding-right: 8px; }
.chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.chip svg.i { width: 12px; height: 12px; }
.chip button { width: 18px; height: 18px; border: 0; border-radius: 99px; background: none; color: inherit; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .15s, background-color .15s; }
.chip button:hover { background: color-mix(in srgb, var(--primary) 18%, transparent); transform: translateY(-1px); }
.chip button:active { transform: scale(.9); }
.chip.erro { background: var(--destructive-soft); color: var(--destructive); }

/* Fluxograma */
.fluxo-card { overflow: hidden; }
.fluxo-caixa { position: relative; overflow: auto; max-width: 100%; cursor: grab; overscroll-behavior-x: contain; background: var(--card); }
.fluxo-caixa.arrastando { cursor: grabbing; user-select: none; }
.fluxo-caixa > svg { display: block; margin: 0 auto; font-family: inherit; }
.raia { fill: color-mix(in srgb, var(--muted) 75%, transparent); }
.raia-titulo { font-size: 12px; font-weight: 700; fill: var(--fg); }
.raia-sub { font-size: 11px; fill: var(--muted-fg); }
.aresta { fill: none; stroke: var(--input); stroke-width: 1.5; }
.aresta.feita { stroke: var(--positive); stroke-opacity: .55; }
.aresta.realce { stroke: var(--primary); stroke-width: 2.25; stroke-opacity: 1; }
.aresta.invalida { stroke: var(--destructive); stroke-dasharray: 4 3; }
.seta { fill: var(--input); }
.seta.feita { fill: var(--positive); fill-opacity: .7; }
.seta.realce { fill: var(--primary); }
.seta.invalida { fill: var(--destructive); }
.no { cursor: pointer; color: var(--muted-fg); outline: none; }
.no.estatico { cursor: default; }

// ── Situação de cada tarefa ────────────────────────────────────────────────
const tarefasDe = (estrutura) => estrutura.etapas.flatMap((e) => e.tarefas)
const tarefaPorId = (estrutura, id) => tarefasDe(estrutura).find((t) => t.id === id)
function situacao(ap, t) {
  const todas = tarefasDe(ap)
  const prazo = somarDias(dia(ap.inicio), t.prazo)
  const faltam = difDias(prazo, HOJE)
  const feito = t.estado === 'feito'
  const espera = feito ? [] : t.deps.map((id) => todas.find((x) => x.id === id)).filter((d) => d && d.estado !== 'feito')
  const bloqueada = espera.length > 0
  const atrasada = !feito && faltam < 0
  const hoje = !feito && faltam === 0
  const cor = feito ? 'feito' : atrasada ? 'atrasada' : hoje ? 'hoje' : t.estado === 'andamento' ? 'andamento' : bloqueada ? 'bloqueada' : 'livre'
  return { prazo, faltam, feito, espera, bloqueada, atrasada, hoje, cor }
}
const rotuloEstado = (t, s) => (s.feito ? 'Feita' : s.bloqueada ? 'Bloqueada' : t.estado === 'andamento' ? 'Em andamento' : 'A fazer')
function resumo(ap) {
  const todas = tarefasDe(ap)
  const sit = todas.map((t) => ({ t, s: situacao(ap, t) }))
  const feitas = sit.filter((x) => x.s.feito).length
  const obrig = todas.filter((t) => t.obrigatoria)
  const proxima = sit.filter((x) => !x.s.feito && !x.s.bloqueada).sort((a, b) => a.s.prazo - b.s.prazo)[0] ?? null
  return {
    total: todas.length, feitas, pct: todas.length ? Math.round((feitas / todas.length) * 100) : 0,
    obrig: obrig.length, obrigFeitas: obrig.filter((t) => t.estado === 'feito').length,
    proximas: sit.filter((x) => !x.s.feito && x.s.faltam >= 0 && x.s.faltam <= 7).length,
    atrasadas: sit.filter((x) => x.s.atrasada).length, proxima,
  }
}
function badgesDaTarefa(t, s) {
  if (s.feito) return `<span class="badge positivo">${icone('check')} Feita</span><span class="t-legenda">por ${esc(t.feitoPor)} em ${esc(t.feitoEm)}</span>`
  const b = []
  if (t.estado === 'andamento') b.push(`<span class="badge azul">${icone('play')} Em andamento</span>`)
  if (s.atrasada) b.push(`<span class="badge perigo">${icone('alerta')} Atrasada · venceu ${fmtCurto(s.prazo)}</span>`)
  else if (s.hoje) b.push(`<span class="badge aviso">${icone('relogio')} Vence hoje</span>`)
  else b.push(`<span class="badge contorno">${icone('calendario')} Vence ${fmtCurto(s.prazo)}</span>`)
  if (s.bloqueada) b.push(`<span class="badge cinza">${icone('cadeado')} Bloqueada</span><span class="t-legenda">espera ${nomes(s.espera)}</span>`)
  return b.join('')
}

// ── Fluxograma (SVG, camadas por etapa + dependências) ─────────────────────
const NO_L = 184
const NO_A = 62
function layoutFluxo(etapas, vertical) {
  const cfg = vertical
    ? { tamMaior: NO_A, tamMenor: NO_L, gapMaior: 34, gapMenor: 16, gapEtapa: 30, cabecalho: 34, inicioMenor: 22 }
    : { tamMaior: NO_L, tamMenor: NO_A, gapMaior: 36, gapMenor: 14, gapEtapa: 54, cabecalho: 0, inicioMenor: 58 }
  const pos = {}
  const raias = []
  let maior = 22
  etapas.forEach((e) => {
    const inicio = maior
    maior += cfg.cabecalho
    const daEtapa = new Set(e.tarefas.map((t) => t.id))
    const nivel = {}
    e.tarefas.forEach((t) => {
      nivel[t.id] = t.deps.reduce((n, d) => (daEtapa.has(d) && nivel[d] !== undefined ? Math.max(n, nivel[d] + 1) : n), 0)
    })
    const niveis = Math.max(1, ...e.tarefas.map((t) => nivel[t.id] + 1))
    for (let lv = 0; lv < niveis; lv++) {
      // Cada tarefa tenta ficar na altura média das tarefas de que depende (menos cruzamentos de setas).
      const grupo = e.tarefas.filter((t) => nivel[t.id] === lv).map((t, i) => {
        const refs = t.deps.filter((d) => pos[d]).map((d) => pos[d].menor)
        return { t, alvo: refs.length ? refs.reduce((a, b) => a + b, 0) / refs.length : cfg.inicioMenor + i * (cfg.tamMenor + cfg.gapMenor) }
      }).sort((a, b) => a.alvo - b.alvo)
      let cursor = cfg.inicioMenor
      grupo.forEach(({ t, alvo }) => {
        const menor = Math.max(cursor, alvo)
        pos[t.id] = { maior: maior + lv * (cfg.tamMaior + cfg.gapMaior), menor }
        cursor = menor + cfg.tamMenor + cfg.gapMenor
      })
    }
    maior += niveis * cfg.tamMaior + (niveis - 1) * cfg.gapMaior
    raias.push({ etapa: e, inicio, fim: maior })
    maior += cfg.gapEtapa
  })
  const fimMaior = maior - cfg.gapEtapa + 22
  const fimMenor = Math.max(cfg.inicioMenor + cfg.tamMenor, ...Object.values(pos).map((p) => p.menor + cfg.tamMenor)) + 22
  const xy = {}
  Object.entries(pos).forEach(([id, p]) => { xy[id] = vertical ? { x: p.menor, y: p.maior } : { x: p.maior, y: p.menor } })
  return { pos: xy, raias, largura: vertical ? Math.max(380, fimMenor) : fimMaior, altura: vertical ? fimMaior : fimMenor }
}
function caminho(a, b, vertical) {
  if (!vertical) {
    const x1 = a.x + NO_L, y1 = a.y + NO_A / 2, x2 = b.x - 3, y2 = b.y + NO_A / 2
    const d = Math.max(18, Math.abs(x2 - x1) / 2)
    return `M${x1} ${y1} C${x1 + d} ${y1} ${x2 - d} ${y2} ${x2} ${y2}`
  }
  const x1 = a.x + NO_L / 2, y1 = a.y + NO_A, x2 = b.x + NO_L / 2, y2 = b.y - 3
  const d = Math.max(16, Math.abs(y2 - y1) / 2)
  return `M${x1} ${y1} C${x1} ${y1 + d} ${x2} ${y2 - d} ${x2} ${y2}`
}
function quebrar(texto, max) {
  const linhas = []
  let atual = ''
  for (const p of texto.split(/\s+/).filter(Boolean)) {
    if (!atual) atual = p
    else if (`${atual} ${p}`.length <= max) atual += ` ${p}`
    else { linhas.push(atual); atual = p }
  }
  if (atual) linhas.push(atual)
  if (linhas.length > 2) { linhas.length = 2; linhas[1] = cortar(`${linhas[1]} …`, max) }
  return linhas.map((l) => cortar(l, max))
}
function desenharFluxo(etapas, { prefixo, vertical, info, interativo = false, selecionado = null, contagem = null, rotulo }) {
  const L = layoutFluxo(etapas, vertical)
  const todas = etapas.flatMap((e) => e.tarefas)
  const ordem = Object.fromEntries(todas.map((t, i) => [t.id, i]))
  const infos = Object.fromEntries(todas.map((t) => [t.id, info(t)]))
  const raias = L.raias.map((r, i) => {
    const titulo = `${i + 1} · ${r.etapa.nome || 'Etapa sem nome'}`
    const cont = contagem ? contagem(r.etapa) : plural(r.etapa.tarefas.length, 'tarefa', 'tarefas')
    if (vertical) {
      return `<rect class="raia" x="8" y="${r.inicio - 10}" width="${L.largura - 16}" height="${r.fim - r.inicio + 24}" rx="14"/>
        <text class="raia-titulo" x="22" y="${r.inicio + 12}">${esc(cortar(titulo, 34))}</text>
        <text class="raia-sub" x="${L.largura - 22}" y="${r.inicio + 12}" text-anchor="end">${esc(cont)}</text>`
    }
    const larg = r.fim - r.inicio
    return `<rect class="raia" x="${r.inicio - 14}" y="10" width="${larg + 28}" height="${L.altura - 20}" rx="14"/>
      <text class="raia-titulo" x="${r.inicio}" y="31">${esc(cortar(titulo, Math.floor((larg + 8) / 7)))}</text>
      <text class="raia-sub" x="${r.inicio}" y="46">${esc(cont)}</text>`
  }).join('')
  const arestas = []
  todas.forEach((t) => t.deps.forEach((d) => {
    const a = L.pos[d], b = L.pos[t.id]
    if (!a || !b) return
    const tipo = selecionado && (selecionado === d || selecionado === t.id) ? 'realce'
      : ordem[d] > ordem[t.id] ? 'invalida' : infos[d].cor === 'feito' ? 'feita' : 'normal'
    arestas.push({ tipo, html: `<path class="aresta ${tipo}" d="${caminho(a, b, vertical)}" marker-end="url(#${prefixo}-seta-${tipo})"/>` })
  }))
  arestas.sort((a, b) => (a.tipo === 'realce') - (b.tipo === 'realce'))
  const nos = todas.map((t) => {
    const p = L.pos[t.id]
    const s = infos[t.id]
    const linhas = quebrar(t.titulo || 'Sem título', 21)
    const yT = linhas.length === 1 ? 27 : 21
    const ySub = linhas.length === 1 ? 45 : 52
    const attrs = interativo
      ? `tabindex="0" role="button" id="no-${t.id}" data-acao="abrir-tarefa" data-id="${t.id}" aria-label="${esc(`${t.titulo}: ${s.rotulo}`)}"`
      : 'aria-hidden="true"'
    return `<g class="no ${s.cor}${s.apagado ? ' apagado' : ''}${selecionado === t.id ? ' selecionado' : ''}${interativo ? '' : ' estatico'}" transform="translate(${p.x} ${p.y})" ${attrs}>
      <title>${esc(t.titulo)} — ${esc(s.sub)}</title>
      <rect class="fundo-no" width="${NO_L}" height="${NO_A}" rx="12"/>
      <circle class="bolinha" cx="19" cy="${yT - 5}" r="10"/>
      <svg class="no-icone" x="12" y="${yT - 12}" width="14" height="14" viewBox="0 0 24 24">${ICONES[s.icone]}</svg>
      <text class="no-titulo">${linhas.map((l, i) => `<tspan x="36" y="${yT + i * 15}">${esc(l)}</tspan>`).join('')}</text>
      <text class="no-sub" x="36" y="${ySub}">${esc(s.sub)}</text>
    </g>`
  }).join('')
  const marcas = ['normal', 'feita', 'realce', 'invalida'].map((m) => `<marker id="${prefixo}-seta-${m}" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 1 L9 5 L0 9 z" class="seta ${m}"/></marker>`).join('')
  return `<svg width="${L.largura}" height="${L.altura}" viewBox="0 0 ${L.largura} ${L.altura}" role="group" aria-label="${esc(rotulo)}"><defs>${marcas}</defs>${raias}${arestas.map((a) => a.html).join('')}${nos}</svg>`
}

// ── Pedaços de tela ────────────────────────────────────────────────────────
function segmentado(acao, opcoes, valor, rotulo, comoAbas = false) {
  return `<div class="segmentado" role="${comoAbas ? 'tablist' : 'group'}" aria-label="${esc(rotulo)}">${opcoes.map(([id, texto, ic, n, aviso]) =>
    `<button type="button" id="seg-${acao}-${id}" ${comoAbas ? `role="tab" aria-selected="${valor === id}"` : `aria-pressed="${valor === id}"`} data-acao="${acao}" data-id="${id}">${ic ? icone(ic) : ''}${esc(texto)}${n !== undefined && n !== null ? `<span class="n ${aviso ? 'aviso' : ''}">${n}</span>` : ''}</button>`).join('')}</div>`
}
const acaoLinha = (acao, id, ic, rotulo, extra = '') =>
  `<button type="button" class="btn fantasma pequeno ${extra}" id="a-${acao}-${id}" data-acao="${acao}" data-id="${id}" title="${esc(rotulo)}" aria-label="${esc(rotulo)}">${icone(ic)}<span class="rotulo-acao">${esc(rotulo)}</span></button>`
const botaoIcone = (acao, id, ic, rotulo, { desabilitado = false, perigo = false, extra = '' } = {}) =>
  `<button type="button" id="b-${acao}-${id}" class="btn-icone ${perigo ? 'perigo' : ''}" data-acao="${acao}" data-id="${id}" aria-label="${esc(rotulo)}" title="${esc(rotulo)}" ${desabilitado ? 'disabled' : ''} ${extra}>${icone(ic)}</button>`
const cabecalhoJanela = (ic, titulo, descricao, comAbas = false) =>
  `<header class="${comAbas ? 'com-abas' : ''}"><span class="janela-icone">${icone(ic)}</span>
    <div class="min0 flex1"><h2 class="t-janela" id="titulo-janela">${titulo}</h2>${descricao ? `<p>${descricao}</p>` : ''}</div>
    <button type="button" class="btn-icone" data-acao="fechar" aria-label="Fechar" title="Fechar">${icone('fechar')}</button></header>`
function tabela(rotulo, colunas, linhas, vazio, larguraMinima = 760) {
  if (!linhas.length) return `<div class="vazio">${vazio}</div>`
  return `<div class="card tabela-card"><div class="rolagem"><table aria-label="${esc(rotulo)}" style="min-width:${larguraMinima}px">
    <thead><tr>${colunas.map((c) => `<th>${c}</th>`).join('')}<th><span class="sr">Ações</span></th></tr></thead>
    <tbody>${linhas.join('')}</tbody></table></div></div>`
}
function avisar(html) {
  const caixa = document.getElementById('toast')
  caixa.innerHTML = `<div class="aviso-toast">${html}</div>`
  clearTimeout(avisar.t)
  avisar.t = setTimeout(() => { caixa.innerHTML = '' }, 4200)
}

function listaModelos(lista) {
  const termo = semAcento(estado.buscaModelos.trim())
  const filtrados = termo ? lista.filter((m) => semAcento(`${m.nome} ${m.descricao}`).includes(termo)) : lista
  const colUsando = estado.papel === 'central' ? 'Clientes usando' : estado.papel === 'gestor' ? 'Clientes da STI usando' : 'Seus clientes usando'
  const linhas = filtrados.map((m) => {
    const todas = tarefasDe(m)
    const usando = clientesUsando(m)
    const acoes = []
    if (podeEditarModelo(m)) {
      if (!m.arquivado) acoes.push(acaoLinha('editar-modelo', m.id, 'lapis', 'Editar'), acaoLinha('duplicar-modelo', m.id, 'copiar', 'Duplicar'), acaoLinha('arquivar-modelo', m.id, 'arquivo', 'Arquivar'))
      else acoes.push(acaoLinha('reativar-modelo', m.id, 'desfazer', 'Reativar'))
      acoes.push(acaoLinha('apagar-modelo', m.id, 'lixeira', 'Apagar', 'realce-perigo'))
    } else {
      acoes.push(acaoLinha('ver-modelo', m.id, 'olho', 'Ver'))
      if (estado.papel === 'gestor' && !m.arquivado) acoes.push(acaoLinha('duplicar-modelo', m.id, 'copiar', 'Duplicar'))
    }
    return `<tr>

      <td class="acoes">${acoes.join('')}</td></tr>`

  const vazio = termo ? 'Nenhum modelo com essa busca.' : estado.abaModelos === 'ativos' ? 'Nenhum modelo ainda. Crie em "Novo modelo".' : 'Nenhum modelo arquivado.'

}

  const aviso = podeMarcar(c) ? '' : `<div class="faixa-info">${icone('olho')}<span>Você acompanha o andamento. Quem marca as tarefas é ${esc(CONSULTORES[c.consultor].nome)}, o consultor do cliente.${c.consultor === 'ana' ? ' Para ver como fica para ela, use <b>Ver como: Consultor</b>, lá em cima.' : ''}</span></div>`

    ${proxima}</div>`
  return topo + aviso + barra + (estado.visao === 'lista' ? listaCheck(c) : fluxoCliente(c)) + historicoCheckins(c)

function cartaoProgresso(c) {

function cartaoSemModelo(c) {
  return `<section class="card cartao" aria-label="Modelo de check-in">
    <div class="cartao-topo"><span class="janela-icone">${icone('prancheta')}</span>

const checkinsDo = (c) => dados.checkins.filter((x) => x.clienteId === c.id)
  .sort((a, b) => (dia(b.data) - dia(a.data)) || (minutos(b.inicio) - minutos(a.inicio)))
function cartaoSessao(c) {

  const status = aqui ? '<span class="badge positivo"><span class="ponto-vivo"></span> Em andamento</span>' : '<span class="badge contorno">Sem check-in aberto</span>'

function listaCheck(c) {

    const tarefas = e.tarefas.filter((t) => f === 'todas' || (f === 'feitas') === (t.estado === 'feito'))
    if (!tarefas.length) return ''
    const feitas = e.tarefas.filter((t) => t.estado === 'feito').length
    return `<section class="card etapa" aria-labelledby="et-${e.id}">
      <header class="etapa-topo"><span class="numero">${ei + 1}</span><h3 id="et-${e.id}">${esc(e.nome)}</h3>
        <div class="progresso-mini"><span class="t-legenda num">${feitas} de ${e.tarefas.length}</span><div class="barra ${feitas === e.tarefas.length ? 'verde' : ''}"><span style="width:${Math.round((feitas / e.tarefas.length) * 100)}%"></span></div></div></header>

function linhaTarefa(c, t) {

// ── Página: Visão da gestão ────────────────────────────────────────────────
function paginaGestao() {
  const todos = clientesVisiveis().map((c) => ({ c, r: c.aplicacao ? resumo(c.aplicacao) : null }))
  const com = todos.filter((x) => x.r)
  const atrasados = todos.filter((x) => x.r?.atrasadas)
  const sem = todos.filter((x) => !x.r)
  const media = com.length ? Math.round(com.reduce((a, x) => a + x.r.pct, 0) / com.length) : 0
  const somaAtrasadas = com.reduce((a, x) => a + x.r.atrasadas, 0)
  const somaProximas = com.reduce((a, x) => a + x.r.proximas, 0)

  return `<div class="cabecalho"><div><h1 class="t-titulo">Visão da gestão</h1>
      <p class="sub-cabecalho">Como cada cliente anda no modelo de check-in. ${estado.papel === 'central' ? 'Todas as consultorias.' : 'Clientes da STI Consult.'}</p></div></div>
    <div class="numeros" style="margin-bottom:16px">
      ${numero('Clientes com modelo', `${com.length} <span class="t-rotulo mudo">de ${todos.length}</span>`)}
      ${numero('Progresso médio', `${media}%`)}
      ${numero('Tarefas atrasadas', somaAtrasadas, somaAtrasadas ? 'perigo' : '')}
      ${numero('Vencem em 7 dias', somaProximas, somaProximas ? 'aviso' : '')}
    </div>
    <div class="card barra-filtros">
      ${segmentado('filtro-gestao', [['todos', 'Todos', null, todos.length], ['atraso', 'Com atraso', null, atrasados.length, atrasados.length > 0], ['sem', 'Sem modelo', null, sem.length]], estado.filtroGestao, 'Mostrar')}
      <label class="busca"><span class="sr">Buscar clientes</span>${icone('lupa')}<input class="input" type="search" id="busca-gestao" placeholder="Buscar cliente, consultor ou modelo" value="${esc(estado.buscaGestao)}"></label>
    </div>
    <div id="lista">${listaGestao(todos)}</div>`
}
function listaGestao(todos) {
  const f = estado.filtroGestao

  const filtrados = todos.filter((x) => (f === 'todos' || (f === 'atraso' ? x.r?.atrasadas : !x.r))
    && (!termo || semAcento(`${x.c.nome} ${CONSULTORES[x.c.consultor].nome} ${x.c.aplicacao?.modeloNome ?? ''}`).includes(termo)))

      <td style="min-width:150px">${r ? `<div class="t-rotulo num">${r.pct}% · ${r.feitas} de ${r.total}</div><div class="barra ${r.pct === 100 ? 'verde' : ''}" style="margin-top:4px"><span style="width:${r.pct}%"></span></div>` : '<span class="mudo">—</span>'}</td>

function perguntas() {
  return `<section class="perguntas" aria-label="O que este protótipo quer validar">

      <li><b>O gestor pode mexer num modelo da Central?</b> Aqui não: ele duplica e adapta para a consultoria dele.</li>

// ── Janelas ────────────────────────────────────────────────────────────────
const ordemDe = (estrutura) => Object.fromEntries(tarefasDe(estrutura).map((t, i) => [t.id, i + 1]))

const novaTarefa = (prazo = 7) => ({ id: novoId('t'), titulo: '', descricao: '', obrigatoria: true, prazo, deps: [] })

function editorEtapas(r, err) {

            ${botaoIcone('descer-tarefa', t.id, 'baixo', 'Descer tarefa', { desabilitado: t.id === ultima })}
            ${botaoIcone('apagar-tarefa', t.id, 'lixeira', 'Apagar tarefa', { perigo: true })}</div>
          <input class="input fino" id="td-${t.id}" data-campo="tarefa-descricao" data-id="${t.id}" value="${esc(t.descricao)}" maxlength="160" placeholder="Descrição curta (opcional)" aria-label="Descrição da tarefa ${ordem[t.id]}">

  const ordem = ordemDe(m)
  const corpo = aba === 'lista'
    ? m.etapas.map((e, ei) => `<section class="ver-etapa"><div class="section-label">${ei + 1} · ${esc(e.nome)}</div>
        <ol class="ver-tarefas">${e.tarefas.map((t) => `<li><span class="ordem">${ordem[t.id]}</span><div class="min0">

function janelaConfirmar() {
  const j = estado.janela
  const m = modeloPorId(j.modeloId)
  const usando = clientesUsando(m, true)
  const listaUsando = juntar(usando.map((c) => `<b>${esc(c.nome)}</b>`))
  let titulo, texto, botoes, ic = 'arquivo'
  if (j.variante === 'arquivar') {
    titulo = `Arquivar "${esc(m.nome)}"?`
    texto = `Ele sai da lista de modelos para aplicar. ${usando.length ? `${usando.length === 1 ? 'O cliente que usa' : `Os ${usando.length} clientes que usam`} (${listaUsando}) ${usando.length === 1 ? 'continua' : 'continuam'} com o check-list.` : 'Nenhum cliente usa este modelo.'} Dá para reativar na aba Arquivados.`
    botoes = `<button type="button" class="btn" data-acao="confirmar-arquivar">${icone('arquivo')} Arquivar</button>`
  } else if (usando.length) {
    ic = 'alerta'
    titulo = `"${esc(m.nome)}" está em uso`
    texto = `${usando.length === 1 ? 'Um cliente usa' : `${usando.length} clientes usam`} este modelo: ${listaUsando}. Apagar quebraria o histórico ${usando.length === 1 ? 'dele' : 'deles'}, então ele não pode ser apagado.${m.arquivado ? '' : ' Arquive: arquivado, ele sai da lista de modelos para aplicar, mas os clientes continuam com o check-list.'}`
    botoes = m.arquivado ? '' : `<button type="button" class="btn" data-acao="confirmar-arquivar">${icone('arquivo')} Arquivar</button>`
  } else {
    ic = 'lixeira'
    const t = tarefasDe(m).length
    titulo = `Apagar "${esc(m.nome)}"?`
    texto = `Somem junto ${plural(m.etapas.length, 'etapa', 'etapas')} e ${plural(t, 'tarefa', 'tarefas')} do modelo. Nenhum cliente usa este modelo. Não dá para desfazer.${m.arquivado ? '' : ' Se quiser só tirar da lista, arquive.'}`
    botoes = `${m.arquivado ? '' : `<button type="button" class="btn contorno" data-acao="confirmar-arquivar">${icone('arquivo')} Arquivar</button>`}<button type="button" class="btn perigo" data-acao="confirmar-apagar">${icone('lixeira')} Apagar</button>`
  }
  return `<div class="janela" role="alertdialog" aria-modal="true" aria-labelledby="titulo-janela" aria-describedby="texto-confirmar" tabindex="-1">
    ${cabecalhoJanela(ic, titulo, '')}
    <div class="corpo"><p class="m0" id="texto-confirmar">${texto}</p></div>
    <footer><button type="button" class="btn contorno" data-acao="fechar">${botoes ? 'Cancelar' : 'Entendi'}</button>${botoes}</footer></div>`
}

  const inicioOk = dataValida(j.inicio)

function janelaTarefa() {
  const j = estado.janela
  const c = clientePorId(j.clienteId)
  const ap = c.aplicacao
  const t = tarefaPorId(ap, j.tarefaId)
  const s = situacao(ap, t)
  const etapaIdx = ap.etapas.findIndex((e) => e.tarefas.includes(t))
  const todas = tarefasDe(ap)
  const deps = t.deps.map((id) => todas.find((x) => x.id === id)).filter(Boolean)
  const libera = todas.filter((x) => x.deps.includes(t.id))
  const pode = podeMarcar(c)
  const rel = (x) => { const sx = situacao(ap, x); return `<li><button type="button" class="rel" data-acao="abrir-tarefa" data-id="${x.id}"><span class="pinta ${sx.cor}"></span><span class="elipse">${esc(x.titulo)}</span><span class="t-legenda">${rotuloEstado(x, sx)}</span></button></li>` }
  const nota = pode
    ? `<div><label class="form-label" for="f-nota">Nota (opcional)</label><textarea class="input" id="f-nota" data-campo="tarefa-nota" rows="3" maxlength="500" placeholder="Ex.: faltam os extratos de setembro">${esc(j.nota)}</textarea></div>`
    : `<div><div class="form-label">Nota</div><p class="m0 ${t.nota ? '' : 'mudo'}">${t.nota ? esc(t.nota) : 'Sem nota.'}</p></div>`
  let botoes = ''
  if (pode) {
    if (s.feito) botoes = `<button type="button" class="btn contorno" data-acao="tarefa-reabrir">${icone('desfazer')} Reabrir tarefa</button><button type="button" class="btn" data-acao="tarefa-nota">${icone('check')} Salvar nota</button>`
    else if (s.bloqueada) botoes = `<button type="button" class="btn" data-acao="tarefa-nota">${icone('check')} Salvar nota</button>`
    else botoes = `${t.estado === 'andamento' ? `<button type="button" class="btn contorno" data-acao="tarefa-afazer">${icone('desfazer')} Voltar para a fazer</button>` : `<button type="button" class="btn contorno" data-acao="tarefa-comecar">${icone('play')} Começar</button>`}<button type="button" class="btn" data-acao="tarefa-feita">${icone('check')} Marcar como feita</button>`
  }
  return `<div class="janela media" role="dialog" aria-modal="true" aria-labelledby="titulo-janela" tabindex="-1">
    ${cabecalhoJanela('prancheta', esc(t.titulo), `${esc(c.nome)} · etapa ${etapaIdx + 1}, ${esc(ap.etapas[etapaIdx].nome)} · ${t.obrigatoria ? 'obrigatória' : 'opcional'}`)}
    <div class="corpo" data-rolagem>
      <div class="tarefa-meta" style="margin:0">${badgesDaTarefa(t, s)}${t.estado === 'andamento' || s.feito ? '' : `<span class="badge contorno">${rotuloEstado(t, s)}</span>`}</div>
      ${t.descricao ? `<p class="m0">${esc(t.descricao)}</p>` : ''}
      ${!s.feito && s.bloqueada && pode ? `<div class="aviso-inline">${icone('cadeado')}<span>Ainda não dá para marcar: espera ${nomes(s.espera)}.</span></div>` : ''}
      <div class="grade-2">
        <div class="caixa-info"><div class="section-label">Prazo</div><div><b>${fmt(s.prazo)}</b> · dia ${t.prazo} a partir de ${esc(ap.inicio)}</div></div>
        <div class="caixa-info"><div class="section-label">${s.feito ? 'Feita' : 'Situação'}</div><div>${s.feito ? `por ${esc(t.feitoPor)} em ${esc(t.feitoEm)}` : s.atrasada ? `Atrasada há ${plural(-s.faltam, 'dia', 'dias')}` : s.hoje ? 'Vence hoje' : `Faltam ${plural(s.faltam, 'dia', 'dias')}`}</div></div>
      </div>
      <div class="grade-2">
        <div><div class="form-label">Depende de</div>${deps.length ? `<ul class="relacoes">${deps.map(rel).join('')}</ul>` : '<p class="t-rotulo mudo m0">Nada: pode começar quando quiser.</p>'}</div>
        <div><div class="form-label">Libera</div>${libera.length ? `<ul class="relacoes">${libera.map(rel).join('')}</ul>` : '<p class="t-rotulo mudo m0">Nenhuma tarefa espera por esta.</p>'}</div>
      </div>
      ${nota}
    </div>
    <footer><button type="button" class="btn contorno" data-acao="fechar">${pode ? 'Cancelar' : 'Fechar'}</button>${botoes}</footer></div>`
}

const JANELAS = { editor: janelaEditor, ver: janelaVerModelo, confirmar: janelaConfirmar, aplicar: janelaAplicar, tarefa: janelaTarefa, checkout: janelaCheckout }

function renderJanela() {
  const alvo = document.getElementById('janela')
  const j = estado.janela
  document.body.classList.toggle('com-janela', Boolean(j))
  if (!j) { alvo.innerHTML = ''; return }
  const foco = document.activeElement?.id
  const html = JANELAS[j.tipo]()
  const fundo = alvo.querySelector('.fundo')
  if (fundo && fundo.dataset.chave === j.chave) {
    // Mesma janela (mudou algo dentro): troca só o conteúdo e mantém a rolagem e o foco.
    const rolagens = [...fundo.querySelectorAll('[data-rolagem]')].map((el) => el.scrollTop)
    fundo.innerHTML = html
    fundo.firstElementChild?.classList.add('sem-animacao')
    fundo.querySelectorAll('[data-rolagem]').forEach((el, i) => { el.scrollTop = rolagens[i] ?? 0 })
    const alvoFoco = j.focar || foco
    j.focar = null
    if (alvoFoco) document.getElementById(alvoFoco)?.focus({ preventScroll: Boolean(foco && !j.focar) })
    return
  }
  alvo.innerHTML = `<div class="fundo" data-acao="fundo" data-chave="${esc(j.chave)}">${html}</div>`
  const inicial = alvo.querySelector('[data-foco-inicial]') || alvo.querySelector('.janela')
  inicial?.focus()
}
function abrirJanela(j) {
  const retorno = estado.janela?.retorno ?? document.activeElement?.id
  fecharPopover()
  estado.janela = { chave: `${j.tipo}-${j.modeloId ?? j.tarefaId ?? j.clienteId ?? ''}-${Date.now()}`, retorno, ...j }
  renderJanela()
}
function fecharJanela() {
  const retorno = estado.janela?.retorno
  estado.janela = null
  fecharPopover()
  render()
  if (retorno) document.getElementById(retorno)?.focus({ preventScroll: true })
}

  if (p.tipo === 'cliente') {
    return `<p class="popover-ajuda">${estado.papel === 'consultor' ? 'Seus clientes' : 'Clientes que você vê'}</p>` + clientesVisiveis().map((c) => {
      const r = c.aplicacao ? resumo(c.aplicacao) : null
      return `<button type="button" class="opcao-menu radio" id="op-cli-${c.id}" role="menuitemradio" aria-checked="${c.id === estado.clienteId}" data-acao="escolher-cliente" data-id="${c.id}">
        <span class="marca">${icone('check')}</span><span class="elipse">${esc(c.nome)}</span><span class="lado">${r ? `${esc(cortar(c.aplicacao.modeloNome, 18))} · ${r.pct}%` : 'sem modelo'}</span></button>`
    }).join('')
  }
  if (p.tipo === 'consultoria') {
    const r = estado.janela.rascunho
    return '<p class="popover-ajuda">Para qual consultoria</p>' + Object.entries(CONSULTORIAS).map(([id, nome]) =>
      `<button type="button" class="opcao-menu radio" id="op-cons-${id}" role="menuitemradio" aria-checked="${r.para === id}" data-acao="escolher-consultoria" data-id="${id}"><span class="marca">${icone('check')}</span><span class="elipse">${esc(nome)}</span></button>`).join('')
  }
  // Dependências: só tarefas que vêm antes na ordem (assim nunca há ciclo).
  const r = estado.janela.rascunho
  const ordem = ordemDe(r)
  const t = tarefasDe(r).find((x) => x.id === p.tarefaId)
  const grupos = r.etapas.map((e) => ({ e, itens: e.tarefas.filter((x) => ordem[x.id] < ordem[t.id]) })).filter((g) => g.itens.length)
  if (!grupos.length) return '<p class="popover-ajuda">Esta é a primeira tarefa: não há nada antes dela. Só tarefas que vêm antes na lista podem ser dependências.</p>'
  return `<p class="popover-ajuda">"${esc(t.titulo || 'Esta tarefa')}" só pode ser marcada depois de:</p>` + grupos.map((g) =>
    `<div class="section-label popover-grupo">${esc(g.e.nome || 'Etapa sem nome')}</div>` + g.itens.map((x) =>
      `<button type="button" class="opcao-menu" id="op-dep-${x.id}" role="menuitemcheckbox" aria-checked="${t.deps.includes(x.id)}" data-acao="alternar-dep" data-id="${x.id}"><span class="marca">${icone('check')}</span><span class="ordem">${ordem[x.id]}</span><span class="elipse">${esc(x.titulo || 'Sem título')}</span></button>`).join('')).join('')
}
function renderPopover() {
  const alvo = document.getElementById('popover')
  const p = estado.popover
  if (!p) { alvo.innerHTML = ''; return }
  const foco = document.activeElement?.id
  alvo.innerHTML = `<div class="popover ${p.mostrado ? 'sem-animacao' : ''}" role="menu" aria-label="${p.tipo === 'deps' ? 'Depende de' : p.tipo === 'cliente' ? 'Clientes' : 'Consultorias'}" style="visibility:hidden">${conteudoPopover()}</div>`
  p.mostrado = true
  const el = alvo.firstElementChild
  const r = p.ancora
  const left = Math.max(12, Math.min(r.left, innerWidth - el.offsetWidth - 12))
  let top = r.bottom + 6
  if (top + el.offsetHeight > innerHeight - 12) top = Math.max(12, r.top - el.offsetHeight - 6)
  Object.assign(el.style, { left: `${left}px`, top: `${top}px`, visibility: '' })
  const alvoFoco = (foco && document.getElementById(foco)?.closest('#popover')) ? document.getElementById(foco) : el.querySelector('[aria-checked="true"]') || el.querySelector('button')
  alvoFoco?.focus({ preventScroll: true })
}
function abrirPopover(botao, cfg) {
  if (estado.popover && estado.popover.ancoraId === botao.id) { fecharPopover(); return }
  estado.popover = { ...cfg, ancora: botao.getBoundingClientRect(), ancoraId: botao.id }
  renderPopover()
}
function fecharPopover(devolverFoco = false) {
  if (!estado.popover) return
  const id = estado.popover.ancoraId
  estado.popover = null
  renderPopover()
  if (devolverFoco) document.getElementById(id)?.focus()
}

// ── Render ─────────────────────────────────────────────────────────────────
const PAGINAS = { cliente: paginaCliente, modelos: paginaModelos, gestao: paginaGestao }
function render() {
  const foco = document.activeElement?.id
  const caixa = document.getElementById('fluxo-caixa')

  renderMoldura()

  const nova = document.getElementById('fluxo-caixa')

  if (!estado.janela && foco) document.getElementById(foco)?.focus({ preventScroll: true })
}
function renderLista() {

  const temp = document.createElement('div')

}
function ajustarAoPapel() {

  const visiveis = clientesVisiveis()

  estado.selecionado = null
}

// ── Ações do check-list ────────────────────────────────────────────────────
function marcar(c, id) {
  const ap = c.aplicacao
  const t = tarefaPorId(ap, id)
  const s = situacao(ap, t)
  if (!podeMarcar(c)) { avisar(`Só ${esc(CONSULTORES[c.consultor].nome)} marca as tarefas deste cliente. Você acompanha.`); return }
  if (s.feito) {
    Object.assign(t, { estado: 'afazer', feitoPor: null, feitoEm: null })
    if (dados.sessao?.clienteId === c.id) dados.sessao.tarefas = dados.sessao.tarefas.filter((x) => x !== id)
    render()
    avisar(`<b>${esc(t.titulo)}</b> voltou para a fazer.`)
    return
  }
  if (s.bloqueada) { avisar(`Ainda não dá para marcar <b>${esc(t.titulo)}</b>: espera ${nomes(s.espera)}.`); return }
  concluir(c, t)
}
function concluir(c, t) {
  const ap = c.aplicacao
  const esperavam = tarefasDe(ap).filter((x) => x.deps.includes(t.id) && situacao(ap, x).bloqueada)
  Object.assign(t, { estado: 'feito', feitoPor: eu().nome, feitoEm: fmt(HOJE) })
  const liberadas = esperavam.filter((x) => !situacao(ap, x).bloqueada)
  const naSessao = dados.sessao?.clienteId === c.id
  if (naSessao && !dados.sessao.tarefas.includes(t.id)) dados.sessao.tarefas.push(t.id)
  render()
  avisar(`<b>${esc(t.titulo)}</b> feita.${liberadas.length ? ` Agora dá para fazer: ${nomes(liberadas)}.` : ''}${naSessao ? ' Entrou no resumo deste check-in.' : ' (Sem check-in aberto: fica feita, fora de uma sessão.)'}`)
}
function acaoTarefa(acao) {
  const j = estado.janela
  const c = clientePorId(j.clienteId)
  const t = tarefaPorId(c.aplicacao, j.tarefaId)
  t.nota = (j.nota ?? '').trim()
  const retorno = j.retorno
  estado.janela = null
  if (acao === 'tarefa-feita') { concluir(c, t) } else {
    if (acao === 'tarefa-reabrir') {
      Object.assign(t, { estado: 'afazer', feitoPor: null, feitoEm: null })
      if (dados.sessao?.clienteId === c.id) dados.sessao.tarefas = dados.sessao.tarefas.filter((x) => x !== t.id)
    }
    if (acao === 'tarefa-comecar') t.estado = 'andamento'
    if (acao === 'tarefa-afazer') t.estado = 'afazer'
    render()
    avisar({ 'tarefa-reabrir': `<b>${esc(t.titulo)}</b> voltou para a fazer.`, 'tarefa-comecar': `<b>${esc(t.titulo)}</b> em andamento.`,
      'tarefa-afazer': `<b>${esc(t.titulo)}</b> voltou para a fazer.`, 'tarefa-nota': 'Nota salva.' }[acao])
  }
  if (retorno) document.getElementById(retorno)?.focus({ preventScroll: true })
}

// ── Salvar (com "Salvando…" de mentira, como no app) ───────────────────────
function validarModelo(r) {
  const erros = { tarefas: new Set(), etapas: new Set(), nome: false, msg: '' }
  const ordem = ordemDe(r)
  const todas = tarefasDe(r)
  if (r.nome.trim().length < 2) { erros.nome = true; erros.msg ||= 'Dê um nome ao modelo (pelo menos 2 letras).' }
  if (!todas.length) erros.msg ||= 'O modelo precisa de pelo menos uma tarefa.'
  r.etapas.forEach((e) => { if (!e.nome.trim()) { erros.etapas.add(e.id); erros.msg ||= 'Dê um nome a todas as etapas.' } })
  r.etapas.forEach((e) => { if (!e.tarefas.length) { erros.etapas.add(e.id); erros.msg ||= `A etapa "${e.nome || 'sem nome'}" está sem tarefas: inclua uma tarefa ou apague a etapa.` } })
  todas.forEach((t) => { if (!t.titulo.trim()) { erros.tarefas.add(t.id); erros.msg ||= 'Toda tarefa precisa de um título.' } })
  todas.forEach((t) => t.deps.forEach((d) => {
    if (ordem[d] > ordem[t.id]) { erros.tarefas.add(t.id); erros.msg ||= `"${t.titulo}" depende de "${todas.find((x) => x.id === d).titulo}", que vem depois. Mova uma das duas ou tire a dependência.` }
  }))
  return erros
}
function salvarModelo() {
  const j = estado.janela
  const r = j.rascunho
  const erros = validarModelo(r)
  if (erros.msg) { j.erros = erros; if (erros.tarefas.size || erros.etapas.size) j.aba = 'tarefas'; renderJanela(); return }
  j.erros = null
  j.salvando = true
  renderJanela()
  setTimeout(() => {
    const limpo = {
      nome: r.nome.trim(), descricao: r.descricao.trim(), para: estado.papel === 'gestor' ? eu().consultoria : r.para,
      etapas: r.etapas.map((e) => ({ ...e, nome: e.nome.trim(), tarefas: e.tarefas.map((t) => ({ ...t, titulo: t.titulo.trim(), descricao: t.descricao.trim() })) })),
    }
    if (j.modeloId) {
      Object.assign(modeloPorId(j.modeloId), limpo)
      avisar(`<b>${esc(limpo.nome)}</b> salvo. Quem já usa este modelo continua com o check-list que recebeu.`)
    } else {
      const p = estado.papel
      dados.modelos.unshift({ id: novoId('m'), ...limpo, arquivado: false, criadoEm: fmt(HOJE),
        criadoPor: { tipo: p === 'central' ? 'central' : 'gestor', nome: eu().nome, consultoria: eu().consultoria } })
      estado.abaModelos = 'ativos'
      avisar(`<b>${esc(limpo.nome)}</b> criado. Ele já aparece em "Aplicar modelo" nos clientes${limpo.para === 'todas' ? ' de todas as consultorias' : ` da ${esc(CONSULTORIAS[limpo.para])}`}.`)
    }
    fecharJanela()
  }, 450)
}
function salvarAplicacao() {
  const j = estado.janela
  if (!dataValida(j.inicio)) { j.erro = 'Informe o início dos prazos no formato dd/mm/aaaa.'; renderJanela(); return }
  j.erro = ''
  j.salvando = true
  renderJanela()
  setTimeout(() => {
    const c = clientePorId(j.clienteId)
    const m = modeloPorId(j.escolhido)
    const trocou = Boolean(c.aplicacao)

    if (dados.sessao?.clienteId === c.id) dados.sessao.tarefas = []
    estado.selecionado = null

    avisar(`<b>${esc(m.nome)}</b> ${trocou ? 'agora é o modelo' : 'aplicado'} em <b>${esc(c.nome)}</b>. ${esc(CONSULTORES[c.consultor].nome)} já vê o check-list.`)

}
function salvarCheckout() {
  const j = estado.janela
  if (!j.descricao.trim()) { j.erro = 'Conte o que foi feito nesta sessão.'; renderJanela(); return }
  j.erro = ''
  j.salvando = true

  setTimeout(() => {

    const fim = Math.max(agora, ses.inicio + 60000)
    dados.checkins.push({ clienteId: c.id, data: fmt(HOJE), inicio: hora(ses.inicio), fim: hora(fim), quem: eu().nome, tarefas, descricao: j.descricao.trim() })
    dados.sessao = null

    avisar(`Check-out feito em <b>${esc(c.nome)}</b>${tarefas.length ? ` com ${plural(tarefas.length, 'tarefa marcada', 'tarefas marcadas')}` : ''}. Está em "Check-ins anteriores".`)
  }, 450)
}

// ── Editor de modelo: mudanças na estrutura ────────────────────────────────
function moverTarefa(r, id, dir) {
  const ei = r.etapas.findIndex((e) => e.tarefas.some((t) => t.id === id))
  const e = r.etapas[ei]
  const ti = e.tarefas.findIndex((t) => t.id === id)
  const [t] = e.tarefas.splice(ti, 1)
  if (dir < 0) {
    if (ti > 0) e.tarefas.splice(ti - 1, 0, t)
    else if (ei > 0) r.etapas[ei - 1].tarefas.push(t)
    else e.tarefas.unshift(t)
  } else if (ti < e.tarefas.length) e.tarefas.splice(ti + 1, 0, t)
  else if (ei < r.etapas.length - 1) r.etapas[ei + 1].tarefas.unshift(t)
  else e.tarefas.push(t)
}
function tirarTarefas(r, ids) {
  const fora = new Set(ids)
  r.etapas.forEach((e) => {
    e.tarefas = e.tarefas.filter((t) => !fora.has(t.id))
    e.tarefas.forEach((t) => { t.deps = t.deps.filter((d) => !fora.has(d)) })
  })
}
function acaoEditor(acao, el) {
  const j = estado.janela
  const r = j.rascunho
  const id = el.dataset.id
  const t = id ? tarefasDe(r).find((x) => x.id === id) : null
  switch (acao) {
    case 'nova-etapa': { const e = { id: novoId('e'), nome: '', tarefas: [novaTarefa(Math.max(7, ...tarefasDe(r).map((x) => x.prazo)))] }; r.etapas.push(e); j.focar = `en-${e.id}`; break }
    case 'nova-tarefa': { const e = etapaDe(r, id); const nova = novaTarefa(e.tarefas.at(-1)?.prazo ?? 7); e.tarefas.push(nova); j.focar = `tt-${nova.id}`; break }
    case 'subir-tarefa': moverTarefa(r, id, -1); break
    case 'descer-tarefa': moverTarefa(r, id, 1); break
    case 'apagar-tarefa': {
      const dependentes = tarefasDe(r).filter((x) => x.deps.includes(id))
      tirarTarefas(r, [id])
      if (dependentes.length) avisar(`A tarefa saiu e também deixou de ser dependência de ${nomes(dependentes)}.`)
      break
    }
    case 'subir-etapa': case 'descer-etapa': {
      const i = r.etapas.findIndex((e) => e.id === id)
      const k = acao === 'subir-etapa' ? i - 1 : i + 1
      ;[r.etapas[i], r.etapas[k]] = [r.etapas[k], r.etapas[i]]
      break
    }
    case 'apagar-etapa': {
      const e = etapaDe(r, id)
      if (e.tarefas.length) { j.armado = id; j.focar = 'b-apagar-etapa-nao' } else r.etapas = r.etapas.filter((x) => x.id !== id)
      break
    }
    case 'apagar-etapa-sim': { const e = etapaDe(r, id); tirarTarefas(r, e.tarefas.map((x) => x.id)); r.etapas = r.etapas.filter((x) => x.id !== id); j.armado = null; break }
    case 'apagar-etapa-nao': j.focar = `b-apagar-etapa-${j.armado}`; j.armado = null; break
    case 'alternar-obrigatoria': t.obrigatoria = !t.obrigatoria; break
    case 'prazo-menos': t.prazo = Math.max(0, (Number(t.prazo) || 0) - 1); break
    case 'prazo-mais': t.prazo = Math.min(365, (Number(t.prazo) || 0) + 1); break
    case 'tirar-dep': t.deps = t.deps.filter((d) => d !== el.dataset.dep); j.focar = `b-deps-${id}`; break
    case 'para-todas': r.para = 'todas'; break
    case 'para-uma': if (r.para === 'todas') r.para = 'sti'; break
    default: return
  }
  renderJanela()
}

// ── Eventos ────────────────────────────────────────────────────────────────
function executar(acao, el) {
  const id = el.dataset.id
  const j = estado.janela
  switch (acao) {
    case 'ver-como':
      estado.papel = id; estado.janela = null; fecharPopover(); ajustarAoPapel(); render()
      avisar(`Agora você vê como <b>${esc(eu().nome)}</b> (${esc(eu().descricao)}).`)
      break
    case 'restaurar':
      dados = semente(); Object.assign(estado, { ...INICIAL, papel: estado.papel, area: estado.area }); ajustarAoPapel(); render()
      avisar('Exemplo restaurado: os dados voltaram ao começo.')
      break
    case 'area': estado.area = id; estado.janela = null; fecharPopover(); render(); scrollTo(0, 0); break
    case 'fora': avisar('Fora do protótipo: aqui funcionam Clientes (aba Check-in), Modelos e Visão da gestão.'); break
    case 'aba-cliente': if (id !== 'checkin') avisar('Fora do protótipo: só a aba Check-in funciona aqui.'); break
    case 'visao': estado.visao = id; render(); break
    case 'filtro': estado.filtro = id; render(); break
    case 'orientacao': estado.orientacao = id; if (j) renderJanela(); else render(); break
    case 'abrir-seletor-cliente': abrirPopover(el, { tipo: 'cliente' }); break
    case 'escolher-cliente': estado.clienteId = id; estado.selecionado = null; fecharPopover(); render(); document.getElementById('seletor-cliente')?.focus(); break
    case 'ir-cliente': estado.clienteId = id; estado.selecionado = null; render(); break
    case 'marcar': marcar(clientePorId(estado.clienteId), id); break
    case 'abrir-tarefa': {
      const c = clientePorId(estado.clienteId)
      estado.selecionado = id
      if (el.closest('svg')) render()
      abrirJanela({ tipo: 'tarefa', clienteId: c.id, tarefaId: id, nota: tarefaPorId(c.aplicacao, id).nota, leitura: !podeMarcar(c) })
      break
    }
    case 'tarefa-feita': case 'tarefa-reabrir': case 'tarefa-comecar': case 'tarefa-afazer': case 'tarefa-nota': acaoTarefa(acao); break
    case 'fazer-checkin': {
      const c = clientePorId(estado.clienteId)
      dados.sessao = { clienteId: c.id, inicio: Date.now(), tarefas: [] }
      render()
      avisar(`Check-in feito em <b>${esc(c.nome)}</b>. O que você marcar agora entra no resumo da sessão.`)
      break
    }
    case 'fazer-checkout': {
      const c = clientePorId(dados.sessao.clienteId)
      const titulos = c.aplicacao ? dados.sessao.tarefas.map((x) => tarefaPorId(c.aplicacao, x)).filter(Boolean).map((t) => t.titulo) : []
      abrirJanela({ tipo: 'checkout', descricao: titulos.length ? `Tarefas concluídas: ${titulos.join('; ')}.` : '', erro: '' })
      break
    }
    case 'aplicar-modelo': case 'aplicar-cliente': {
      const c = clientePorId(acao === 'aplicar-cliente' ? id : estado.clienteId)
      abrirJanela({ tipo: 'aplicar', clienteId: c.id, escolhido: c.aplicacao?.modeloId, inicio: fmt(HOJE), erro: '' })
      break
    }
    case 'escolher-modelo': j.escolhido = id; j.focar = `b-escolher-${id}`; renderJanela(); break
    case 'abrir-cliente': estado.area = 'cliente'; estado.clienteId = id; estado.selecionado = null; render(); scrollTo(0, 0); break
    case 'aba-modelos': estado.abaModelos = id; render(); break
    case 'filtro-gestao': estado.filtroGestao = id; render(); break
    case 'novo-modelo':
      abrirJanela({ tipo: 'editor', aba: 'tarefas', rascunho: { nome: '', descricao: '', para: estado.papel === 'gestor' ? eu().consultoria : 'todas', etapas: [{ id: novoId('e'), nome: 'Diagnóstico', tarefas: [novaTarefa(2)] }] } })
      break
    case 'editar-modelo': abrirJanela({ tipo: 'editor', aba: 'tarefas', modeloId: id, rascunho: structuredClone(modeloPorId(id)) }); break
    case 'duplicar-modelo': {
      const m = modeloPorId(id)
      const copia = structuredClone(m)
      copia.etapas.forEach((e) => { e.id = novoId('e') })
      abrirJanela({ tipo: 'editor', aba: 'tarefas', origem: m.nome,
        rascunho: { nome: `${m.nome} (cópia)`, descricao: copia.descricao, para: estado.papel === 'gestor' ? eu().consultoria : m.para, etapas: copia.etapas } })
      break
    }
    case 'ver-modelo': abrirJanela({ tipo: 'ver', modeloId: id, aba: 'lista', leitura: true }); break
    case 'aba-ver': case 'aba-editor': j.aba = id; renderJanela(); break
    case 'arquivar-modelo': abrirJanela({ tipo: 'confirmar', variante: 'arquivar', modeloId: id }); break
    case 'apagar-modelo': abrirJanela({ tipo: 'confirmar', variante: 'apagar', modeloId: id }); break
    case 'reativar-modelo': { const m = modeloPorId(id); m.arquivado = false; render(); avisar(`<b>${esc(m.nome)}</b> voltou para os ativos.`); break }
    case 'confirmar-arquivar': { const m = modeloPorId(j.modeloId); m.arquivado = true; fecharJanela(); avisar(`<b>${esc(m.nome)}</b> arquivado. Ele está na aba Arquivados.`); break }
    case 'confirmar-apagar': { const m = modeloPorId(j.modeloId); dados.modelos = dados.modelos.filter((x) => x !== m); fecharJanela(); avisar(`<b>${esc(m.nome)}</b> apagado.`); break }
    case 'abrir-deps': abrirPopover(el, { tipo: 'deps', tarefaId: id }); break
    case 'alternar-dep': {
      const t = tarefasDe(j.rascunho).find((x) => x.id === estado.popover.tarefaId)
      t.deps = t.deps.includes(id) ? t.deps.filter((d) => d !== id) : [...t.deps, id]
      renderJanela(); renderPopover()
      break
    }
    case 'abrir-consultorias': abrirPopover(el, { tipo: 'consultoria' }); break
    case 'escolher-consultoria': j.rascunho.para = id; fecharPopover(); j.focar = 'seletor-consultoria'; renderJanela(); break
    case 'fechar': if (!j?.salvando) fecharJanela(); break
    case 'fundo': if (j?.leitura) fecharJanela(); break
    default: if (j?.tipo === 'editor') acaoEditor(acao, el)
  }
}

document.addEventListener('click', (e) => {
  // Clique fora do menu suspenso (e fora do botão que o abre) fecha o menu.
  if (estado.popover && !e.target.closest('#popover') && !e.target.closest('[data-abre-popover]')) fecharPopover()
  const el = e.target.closest('[data-acao]')
  if (!el || el.disabled) return
  if (el.dataset.acao === 'fundo' && e.target !== el) return
  executar(el.dataset.acao, el)
})

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (estado.popover) { fecharPopover(true); return }
    if (estado.janela && !estado.janela.salvando) fecharJanela()
    return
  }
  // Nós do fluxograma são <g role="button">: Enter e espaço abrem a tarefa.
  const no = e.target.closest?.('g[role="button"]')
  if (no && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); executar(no.dataset.acao, no) }
})

document.addEventListener('input', (e) => {
  const el = e.target
  if (el.id === 'busca-modelos') { estado.buscaModelos = el.value; renderLista(); return }
  if (el.id === 'busca-gestao') { estado.buscaGestao = el.value; renderLista(); return }
  const j = estado.janela
  if (!j || !el.dataset.campo) return
  const campo = el.dataset.campo
  if (campo === 'aplicar-inicio') {
    j.inicio = el.value.trim()
    const m = modeloPorId(j.escolhido)
    const maxPrazo = m ? Math.max(...tarefasDe(m).map((t) => t.prazo)) : 0
    const caixa = document.getElementById('previa-aplicar')
    if (caixa) caixa.textContent = m && dataValida(j.inicio) ? `${plural(tarefasDe(m).length, 'tarefa', 'tarefas')} em ${plural(m.etapas.length, 'etapa', 'etapas')} · a última vence em ${fmt(somarDias(dia(j.inicio), maxPrazo))} (dia ${maxPrazo})` : 'Escolha um modelo e uma data válida.'
    return
  }
  if (campo === 'tarefa-nota') { j.nota = el.value; return }
  if (campo === 'checkout-descricao') { j.descricao = el.value; return }
  const r = j.rascunho
  if (!r) return
  if (campo === 'modelo-nome') r.nome = el.value
  else if (campo === 'modelo-descricao') r.descricao = el.value
  else if (campo === 'etapa-nome') etapaDe(r, el.dataset.id).nome = el.value
  else {
    const t = tarefasDe(r).find((x) => x.id === el.dataset.id)
    if (campo === 'tarefa-titulo') {
      t.titulo = el.value
      const n = ordemDe(r)[t.id]
      document.querySelectorAll(`[data-chip="${t.id}"]`).forEach((chip) => { chip.textContent = `${n} · ${el.value || 'Sem título'}` })
    } else if (campo === 'tarefa-descricao') t.descricao = el.value
    else if (campo === 'tarefa-prazo') {
      const limpo = el.value.replace(/\D/g, '').slice(0, 3)
      if (limpo !== el.value) el.value = limpo
      t.prazo = Math.min(365, Number(limpo) || 0)
    }
  }
})

document.addEventListener('submit', (e) => {
  e.preventDefault()
  const j = estado.janela
  if (!j || j.salvando) return
  if (j.tipo === 'editor') salvarModelo()
  else if (j.tipo === 'aplicar') salvarAplicacao()
  else if (j.tipo === 'checkout') salvarCheckout()
})

// Rolar a janela com o menu suspenso aberto fecha o menu (ele ficaria solto na tela).
document.addEventListener('scroll', (e) => {
  if (estado.popover && !(e.target instanceof Element && e.target.closest('#popover'))) fecharPopover()
}, true)
addEventListener('resize', () => fecharPopover())

// Arrastar o fluxograma com o mouse (no celular o dedo já rola o quadro).
let arraste = null
document.addEventListener('pointerdown', (e) => {
  const caixa = e.target.closest('.fluxo-caixa')
  if (!caixa || e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.no:not(.estatico)')) return
  arraste = { caixa, x: e.clientX, y: e.clientY, l: caixa.scrollLeft, t: caixa.scrollTop }
  caixa.classList.add('arrastando')
})
document.addEventListener('pointermove', (e) => {
  if (!arraste) return
  arraste.caixa.scrollLeft = arraste.l - (e.clientX - arraste.x)
  arraste.caixa.scrollTop = arraste.t - (e.clientY - arraste.y)
})
document.addEventListener('pointerup', () => { if (arraste) { arraste.caixa.classList.remove('arrastando'); arraste = null } })

// Relógio do check-in aberto.
setInterval(() => {
  if (!dados.sessao) return
  const texto = cronometro(Date.now() - dados.sessao.inicio)
  document.querySelectorAll('[data-cronometro]').forEach((el) => { el.textContent = texto })
}, 1000)

render()
</script>
</body>
</html>
