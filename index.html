      // tema antes de a página aparecer (sem piscar): escolha salva ou o tema do computador
      try {
        var t = localStorage.getItem('consultoria:tema')
        if (t === 'escuro' || ((!t || t === 'sistema') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
